name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required documentation
        shell: bash
        run: |
          for file in README.md AGENTS.md planning.md STATUS.md docs/PRODUCT.md docs/ARCHITECTURE.md docs/SUBMISSION.md docs/INSTALL.md docs/SECURITY.md; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.lock'; then
            echo "Conflict markers found"; exit 1
          fi
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require reproducible dependency lockfiles
        shell: bash
        run: |
          test -s package-lock.json || { echo "Root package-lock.json is required; app checks must not be skipped."; exit 1; }
          test -s static/hello-world/package-lock.json || { echo "UI package-lock.json is required; app checks must not be skipped."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/hello-world/package-lock.json
      - run: npm ci
      - run: npm --prefix static/hello-world ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx forge lint
