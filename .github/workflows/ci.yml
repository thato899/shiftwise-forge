name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required documentation
        shell: bash
        run: |
          for file in README.md AGENTS.md planning.md STATUS.md docs/PRODUCT.md docs/ARCHITECTURE.md docs/SUBMISSION.md docs/INSTALL.md; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.lock'; then
            echo "Conflict markers found"; exit 1
          fi
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect app
        id: app
        shell: bash
        run: |
          if test -f package-lock.json; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
        if: steps.app.outputs.exists == 'true'
      - run: npm run lint --if-present
        if: steps.app.outputs.exists == 'true'
      - run: npm run typecheck --if-present
        if: steps.app.outputs.exists == 'true'
      - run: npm test --if-present
        if: steps.app.outputs.exists == 'true'
      - run: npm run build --if-present
        if: steps.app.outputs.exists == 'true'
      - run: npx forge lint
        if: steps.app.outputs.exists == 'true'
