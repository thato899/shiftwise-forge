modules:
  jira:globalPage:
    - key: shiftwise-global-page
      resource: main
      resolver:
        function: resolver
      render: native
      title: Shiftwise
  function:
    - key: shiftwise-resolver
      handler: src/index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - storage:app
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/REPLACE_WITH_FORGE_APP_ID
