modules:
  jira:globalPage:
    - key: shiftwise-global-page
      resource: main
      resolver:
        function: resolver
      render: native
      title: Shiftwise
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - storage:app
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
